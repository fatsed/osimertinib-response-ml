[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osimertinib-response-ml"
version = "0.1.0"
description = "Reproducible ML research for osimertinib response states in EGFR-mutant NSCLC"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
